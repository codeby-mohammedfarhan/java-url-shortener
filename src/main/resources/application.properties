
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/url_shortener}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate applies additive schema changes when the application starts. The
# expires_at mapping remains nullable so existing rows can survive this update.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.url.expiry=${URL_EXPIRY:30d}
app.url.cleanup-cron=0 0 0 * * *
